<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    方案 3/4：四段流水线（Pipeline）
    · 四段式编译器（预处理→前端→中端→后端）：四个节点 + 阶梯折线 + 出口箭头
    · 配色：靛蓝系 + 青色出口（无琥珀）
  -->
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <!-- 阶梯折线（四段连接） -->
  <path d="M 120 392 L 120 280 L 256 280 L 256 168 L 392 168" fill="none" stroke="url(#g3)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 出口箭头（青色） -->
  <path d="M 392 168 L 448 168" stroke="#06B6D4" stroke-width="26" stroke-linecap="round"/>
  <path d="M 422 136 L 452 168 L 422 200" fill="none" stroke="#06B6D4" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 四个节点 -->
  <circle cx="120" cy="392" r="40" fill="url(#g3)"/>
  <circle cx="120" cy="280" r="40" fill="url(#g3)"/>
  <circle cx="256" cy="280" r="40" fill="url(#g3)"/>
  <circle cx="256" cy="168" r="40" fill="url(#g3)"/>
</svg>
