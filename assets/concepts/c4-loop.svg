<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    方案 4/4：∞ 自举环（Loop）—— 暖橙渐变
    · 自举（self-hosting）：连续单线 ∞ 形环 + 中心三态点
    · 配色：橙 → 珊瑚渐变（暖色系，与冷色方案对比）
  -->
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
  </defs>
  <!-- ∞ 双环（连续粗线） -->
  <path d="M 148 256 C 148 150 236 150 236 256 C 236 362 148 362 148 256 Z" fill="none" stroke="url(#g4)" stroke-width="44" stroke-linecap="round"/>
  <path d="M 364 256 C 364 150 276 150 276 256 C 276 362 364 362 364 256 Z" fill="none" stroke="url(#g4)" stroke-width="44" stroke-linecap="round"/>
  <!-- 中心三态点 -->
  <circle cx="256" cy="256" r="26" fill="#0F172A"/>
</svg>
