[package]
name = "tie-frontend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tie 语言编译器前端：词法分析（含 ASI）→ 语法分析 → 语义分析（符号表/类型检查），全部自研实现"

[dependencies]
# 注：Harbor M3 自举后 tie-prep 将依赖 tie-interp（解释执行 tie 语言写的预处理模块），
# 而 tie-frontend 被 tie-interp 依赖——为保持依赖图无环，import 展开的清理逻辑
# 已在 imports.rs 本地化（clean_source），此处不再依赖 tie-prep。

[lints]
# 注意：[lints] workspace = true 与本地覆盖无法共存（Cargo 限制）。
# 手动展开 workspace 的 rust lints（unused），并把 unsafe_code 从 forbid 放宽为 allow：
# tie-frontend 需要调用 Windows API 设置控制台 UTF-8 代码页（init_console_utf8），
# 这是本 crate 唯一使用 unsafe 的地方。
[lints.rust]
unused = { level = "warn", priority = -1 }
unsafe_code = "allow"
