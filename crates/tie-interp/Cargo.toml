# tie-interp：tie 语言解释器包配置
#
# 职责：声明 tie-interp 的依赖与编译参数。
# 说明：
# - 产物同时提供 rlib（tie 主程序链接）与 staticlib（REPL 自举：repl.exe 链接 C ABI 桥）；
# - workspace 统一禁止 unsafe，但本 crate 需要导出 C ABI（裸指针解引用），
#   故在 crate 级覆盖为 allow（仅此处，其他 crate 保持 forbid）。
[package]
name = "tie-interp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "tie 语言解释器：树遍历求值 AST，内置标准库"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
tie-frontend = { path = "../tie-frontend" }
# 正则表达式引擎（P1 语言底座原语）：regex crate 提供 RE2 风格无回溯匹配，
# 编译/解释两路径共用；tie 语言本身无法自举正则引擎，属 Rust 底座原语。
regex = "1"

[lints]
# 注：不能用 [lints] workspace = true + 本地覆盖共存（Cargo 限制）。
# 手动展开 workspace 的 rust lints（unused），仅将 unsafe_code 从 forbid 改为 allow：
# C ABI 导出（tie_eval_expr 等）需解引用裸指针，这是唯一允许 unsafe 的 crate。
[lints.rust]
unused = { level = "warn", priority = -1 }
unsafe_code = "allow"
