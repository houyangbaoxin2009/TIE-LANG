<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    vscode-tie 扩展图标 —— 缺口环（深色圆角底，适配浅/深主题）
    · 背景：石墨黑圆角方块（VSCode 扩展图标惯例）
    · 环：白色，缺口对角；点：亮青
  -->
  <!-- 圆角背景 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#0F172A"/>

  <!-- 左大半弧 -->
  <path d="M 95.15 176.7 A 58.75 58.75 0 0 1 95.15 79.3"
        fill="none" stroke="#FFFFFF" stroke-width="23.75" stroke-linecap="butt"/>
  <!-- 右大半弧 -->
  <path d="M 160.85 79.3 A 58.75 58.75 0 0 1 160.85 176.7"
        fill="none" stroke="#FFFFFF" stroke-width="23.75" stroke-linecap="butt"/>
  <!-- 悬浮青点 -->
  <circle cx="128" cy="76.1" r="8.75" fill="#38BDF8"/>
</svg>
